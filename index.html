<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LateCheck</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LateCheck">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --page:#F3F6F2; --surface:#F6F8F5; --line:#E3E9E2; --ink:#17261D; --muted:#66756B;
  --green:#2E5B43; --green-2:#3E7255; --sage:#A8BDA6; --sage-soft:#EDF3EC; --btn:#2E5B43; --btn-ink:#FFFFFF;
  --danger:#C2412F; --danger-soft:#FBECEA; --warn:#A8661A; --warn-soft:#FCF1E1; --ok:#2E7A4F; --ok-soft:#E6F3EA;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101813; --page:#0B110D; --surface:#17221B; --line:#26352B; --ink:#E8EFE9; --muted:#9BAA9F;
    --green:#7FBF97; --green-2:#94CDA9; --sage:#5E7A62; --sage-soft:#1B2A20; --btn:#5F9E78; --btn-ink:#0D140F;
    --danger:#F08A7A; --danger-soft:#3A1F1B; --warn:#E9B26A; --warn-soft:#332716; --ok:#8FD3A6; --ok-soft:#1A2E21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101813; --page:#0B110D; --surface:#17221B; --line:#26352B; --ink:#E8EFE9; --muted:#9BAA9F;
  --green:#7FBF97; --green-2:#94CDA9; --sage:#5E7A62; --sage-soft:#1B2A20; --btn:#5F9E78; --btn-ink:#0D140F;
  --danger:#F08A7A; --danger-soft:#3A1F1B; --warn:#E9B26A; --warn-soft:#332716; --ok:#8FD3A6; --ok-soft:#1A2E21;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:clip;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
html{background:var(--bg)}
@media (min-width:520px){html,body{background:var(--page)}#app{box-shadow:0 0 0 1px var(--line)}}
#app{width:100%;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 8px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em}
.top .brand{text-align:left;padding-left:10px;font-size:19px}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.main{flex:1;padding:8px 20px 28px}
.has-nav .main{padding-bottom:96px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:12px;position:relative}
.nav a.on{color:var(--green);font-weight:600}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

h2.title{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:10px 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px}
h3.sec{font-size:17px;margin:26px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h3.sec a{font-size:14px;font-weight:600;text-decoration:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:var(--r-md);background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;padding:0 16px;transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.985)}
.btn[disabled],.btn.busy{opacity:.55;pointer-events:none}
.btn.soft{background:var(--sage-soft);color:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:40px;font-size:14.5px;border-radius:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:10px}

.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.tint{background:var(--sage-soft);border:0;border-radius:var(--r-lg);padding:18px}
.kpi-big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi-label{color:var(--muted);font-size:13.5px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:21px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.trend{font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:999px}
.trend.down{color:var(--danger);background:var(--danger-soft)}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;text-decoration:none;color:inherit;background:var(--bg)}
a.item:hover{border-color:var(--sage)}
.thumb{width:58px;height:58px;border-radius:11px;object-fit:cover;flex:none;background:var(--sage-soft)}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px}
.amount{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.mute{background:var(--surface);color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--sage-soft);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}

.kv{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:13px 14px}
.kv>div+div{border-top:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.kv .neg{color:var(--danger)}
.kv .total{background:var(--surface)}
.kv .total span:first-child{color:var(--ink);font-weight:600}

label.f{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.input{width:100%;min-height:48px;font-size:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;outline:none}
textarea.input{padding:12px 14px;min-height:84px;resize:vertical}
.input:focus{border-color:var(--green);background:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1px}

.photo-pick{position:relative;height:170px;border-radius:var(--r-lg);overflow:hidden;background:var(--sage-soft);display:block;cursor:pointer}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick .lbl{position:absolute;left:12px;bottom:12px;background:rgba(20,30,24,.62);color:#fff;font-size:14px;font-weight:600;padding:8px 12px;border-radius:11px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}

.step{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.step+.step{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.stepper output{min-width:58px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--surface)}

.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;cursor:pointer;margin-bottom:10px}
.choice input{accent-color:var(--green);width:20px;height:20px;margin:0}
.choice.on{border-color:var(--green);background:var(--sage-soft)}
.choice .grow{font-weight:600;font-size:16px}
.choice .t{color:var(--muted);font-size:13px;font-weight:400}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:2px}
.tabs a{flex:none;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);background:var(--surface);padding:7px 13px;border-radius:999px}
.tabs a.on{background:var(--btn);color:var(--btn-ink)}

.hero{margin:0 -20px;height:250px;position:relative;overflow:hidden;background:var(--sage-soft)}
.hero img{width:100%;height:100%;object-fit:cover}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;margin:-26px -20px 0;position:relative;padding:24px 22px 4px;text-align:center}
.sheet h2{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 24px;color:var(--muted);font-size:12.5px}
.features svg{color:var(--green);margin:0 auto 6px;display:block}

.state{text-align:center;padding:40px 6px 10px}
.state .ico{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:var(--sage-soft);color:var(--green)}
.state .ico.bad{background:var(--danger-soft);color:var(--danger)}
.state h2{font-size:25px;margin:0 0 10px;letter-spacing:-.02em}
.state p{color:var(--muted);margin:0 auto 20px;max-width:330px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sage-soft);border-radius:var(--r-md);padding:13px 14px;text-align:left;font-size:14px;color:var(--ink)}
.note svg{flex:none;color:var(--green);margin-top:1px}
.note.warn{background:var(--warn-soft)} .note.warn svg{color:var(--warn)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px}

.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.chart i{flex:1;background:var(--sage);border-radius:3px 3px 0 0;min-height:2px}
.chart i.hi{background:var(--green)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}

.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:.2s}
.toggle span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--green-2)}
.toggle input:checked+span::before{transform:translateX(20px)}
.menu{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.menu>*{display:flex;align-items:center;gap:12px;padding:15px 14px;text-decoration:none;color:inherit;background:none;border:0;width:100%;text-align:left;cursor:pointer;font-size:15px}
.menu>*+*{border-top:1px solid var(--line)}
.menu .chev{margin-left:auto;color:var(--muted)}
.menu .red{color:var(--danger)}

.qrbox{border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;place-items:center;background:#fff}
.qrbox canvas,.qrbox img{width:200px!important;height:200px!important}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.auth-ill{width:96px;height:96px;margin:30px auto 18px;color:var(--green)}
.center{text-align:center}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:18px}.mt2{margin-top:28px}
.small{font-size:13px;color:var(--muted)}
.cardnum{letter-spacing:.06em}
.applepay{background:#000;color:#fff}
:root[data-theme="dark"] .applepay{background:#fff;color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .applepay{background:#fff;color:#000}}

.poster-frame{background:var(--surface);border-radius:var(--r-lg);padding:24px 16px;display:grid;place-items:center}
.poster-frame img{width:min(100%,300px);aspect-ratio:1240/1754;border-radius:6px;background:#fff;box-shadow:0 18px 40px rgba(23,38,29,.18),0 2px 6px rgba(23,38,29,.12)}
.optrow{margin-top:14px}.optrow>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--btn);color:var(--btn-ink)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.spin{animation:none}.btn{transition:none}}

#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;inset:0;text-align:center;padding:0;font-family:Figtree,sans-serif;color:#17261D}
  #print-area img{width:100%!important;height:auto!important;margin:0!important;display:block}
  @page{size:A5 portrait;margin:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<script>
"use strict";
/* ============================ Icônes ============================ */
const I = {

  info:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  bolt:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>',
  lock:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  cal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 14.5l2 2 4-4"/></svg>',
  cam:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dl:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',

let STATE = {me:null, users:[], listings:[], requests:[], payments:[], emails:[], settings:{}, guest:null, hasAdmin:false};
async function api(method, url, body){
  let r;
  try{ r = await fetch(url, {method, credentials:'same-origin', headers:{'Content-Type':'application/json','X-LC':'1'}, body: body ? JSON.stringify(body) : undefined}); }
  catch(e){ throw Object.assign(new Error('Connexion au serveur impossible. Vérifiez votre réseau.'), {network:true}); }
  let data = {}; try{ data = await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(data.error || 'Une erreur est survenue.'), {status:r.status, code:data.code});
  return data;
}
function stateQuery(path){
  const p = new URLSearchParams(); let m;
  if((m = path.match(/^\/s\/([^/?]+)/))){ p.set('slug', m[1]); const mine = guestMine(); if(mine.length) p.set('mine', mine.map(x=>x.id+':'+x.t).join(',')); }
  if((m = path.match(/^\/r\/([^/?]+)\/([^/?]+)/))){ p.set('rid', m[1]); p.set('rt', m[2]); }
  if((m = path.match(/^\/pay\/([^/?]+)/))) p.set('pay', m[1]);
  return p.toString();
}
function guestMine(){ try{ return JSON.parse(localStorage.getItem('lc_guest_reqs')||'[]'); }catch(e){ return []; } }
function rememberGuest(id, t){ try{ const m=guestMine().filter(x=>x.id!==id); m.unshift({id,t}); localStorage.setItem('lc_guest_reqs', JSON.stringify(m.slice(0,20))); }catch(e){} }
function getDraft(){ try{ return JSON.parse(sessionStorage.getItem('lc_draft')||'null'); }catch(e){ return getDraft._m||null; } }
function setDraft(d){ getDraft._m=d; try{ sessionStorage.setItem('lc_draft', JSON.stringify(d)); }catch(e){} }

const route = (pattern, fn) => ROUTES.push({re:new RegExp('^'+pattern.replace(/:[a-z]+/g,'([^/?]+)')+'(?:\\?[^#]*)?$'), fn});

async function render(){
  clearInterval(pollTimer); pollTimer = null;
  const path = location.hash.replace(/^#/,'') || '/';
  const seq = ++renderSeq;
  try{ STATE = await api('GET', '/api/state?' + stateQuery(path)); }
  catch(e){ if(seq!==renderSeq) return;
    page(`<main class="main"><div class="state"><div class="ico bad">${I.x}</div><h2>Serveur injoignable</h2><p>${esc(e.message)}</p><button class="btn" data-act="retry">Réessayer</button></div></main>`); return; }
  if(seq !== renderSeq) return;
  for(const r of ROUTES){ const m = path.match(r.re); if(m){ r.fn(...m.slice(1).map(x => x===undefined ? x : decodeURIComponent(x))); window.scrollTo(0,0); return; } }
  go('#/');
}

function chart(values, labels){

  <div class="axis"><span>${esc(labels[0])}</span><span>${esc(labels[Math.floor(labels.length/2)])}</span><span>${esc(labels[labels.length-1])}</span></div>`;

function daysSeries(payments, days, field){
  const vals=[], labels=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const s=d.getTime(), e=s+86400000;
    vals.push(sum(payments.filter(p=>ok(p)&&p.createdAt>=s&&p.createdAt<e), p=>p[field])); labels.push(d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})); }
  return {vals, labels};
}

async function withLock(btn, fn){
  if(!btn || btn.classList.contains('busy')) return;
  const html = btn.innerHTML; btn.classList.add('busy'); btn.innerHTML = '<span class="spin"></span>';
  try{ await fn(); }
  catch(e){ toast(e.message); }
  finally{ if(document.body.contains(btn)){ btn.classList.remove('busy'); btn.innerHTML = html; } }
}
async function submitForm(btn, errEl, fn){
  if(btn.classList.contains('busy')) return; errEl.textContent=''; const html=btn.innerHTML; btn.classList.add('busy'); btn.innerHTML='<span class="spin"></span>';
  try{ await fn(); } catch(e){ errEl.textContent = e.message; } finally { if(document.body.contains(btn)){ btn.classList.remove('busy'); btn.innerHTML=html; } }
}

    const max=1000, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; img.src=fr.result; }; fr.readAsDataURL(file); });
}

/* ============================ Affiche QR code (A5) ============================ */
const POSTER_W = 1240, POSTER_H = 1754; // A5 portrait, ~210 dpi
const P_STYLES = {
  sauge:{label:'Sauge', bg:'#EEF3EC', ink:'#17261D', accent:'#2E5B43', muted:'#5C6B61', chip:'#DCE7DA', card:'#FFFFFF'},
  foret:{label:'Forêt', bg:'#23463A', ink:'#FFFFFF', accent:'#CFE3C9', muted:'#B7CBBE', chip:'#2F5848', card:'#FFFFFF'},
  blanc:{label:'Blanc', bg:'#FFFFFF', ink:'#17261D', accent:'#2E5B43', muted:'#66756B', chip:'#EEF3EC', card:'#F4F7F3'}
};
const P_HEADS = {
  rester:{label:'Restez plus longtemps', fr:['Restez','plus longtemps.'], en:'Stay a little longer.'},
  grasse:{label:'Grasse matinée', fr:['Grasse matinée','demain ?'], en:'Sleep in tomorrow?'},
  presse:{label:'Pas besoin de se presser', fr:['Pas besoin','de vous presser.'], en:'No need to rush.'}
};
const P_FONT = 'Figtree, -apple-system, "Segoe UI", Roboto, sans-serif';
function posterOpts(id){ const d={style:'sauge', head:'rester', lang:'fren'}; try{ return {...d, ...JSON.parse(localStorage.getItem('lc_poster_'+id)||'{}')}; }catch(e){ return d; } }
function savePosterOpts(id,o){ try{ localStorage.setItem('lc_poster_'+id, JSON.stringify(o)); }catch(e){} }
function pRound(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function pFont(x, weight, size, style=''){ x.font = `${style} ${weight} ${size}px ${P_FONT}`.trim(); }
function pFit(x, text, maxW, size, weight, style=''){ let s=size; while(s>14){ pFont(x,weight,s,style); if(x.measureText(text).width<=maxW) break; s-=2; } return s; }
async function posterCanvas(l, o){
  try{ await document.fonts.ready; }catch(e){}
  const S=P_STYLES[o.style]||P_STYLES.sauge, H=P_HEADS[o.head]||P_HEADS.rester, en=o.lang==='fren';
  const W=POSTER_W, M=100;
  const tmp=document.createElement('div'); drawQR(tmp, guestUrl(l), 500); await new Promise(r=>setTimeout(r,40));
  const qr=tmp.querySelector('canvas');
  const c=document.createElement('canvas'); c.width=W; c.height=POSTER_H; const x=c.getContext('2d');
  x.fillStyle=S.bg; x.fillRect(0,0,W,POSTER_H); x.textBaseline='alphabetic';

  // Marque + horloge
  x.textAlign='left'; x.fillStyle=S.accent; pFont(x,700,40); x.fillText('LateCheck', M, 150);
  const cx=1030, cy=250, r=118;
  x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fillStyle=S.chip; x.fill();
  x.lineWidth=14; x.strokeStyle=S.accent; x.stroke();
  x.lineCap='round'; x.lineWidth=14;
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx, cy-78); x.stroke();                       // minutes : 12
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(-Math.PI/6)*58, cy+Math.sin(-Math.PI/6)*58); x.stroke(); // heures : ~2
  x.beginPath(); x.arc(cx,cy,10,0,Math.PI*2); x.fillStyle=S.accent; x.fill();

  // Accroche
  x.fillStyle=S.ink; const fs=Math.min(pFit(x,H.fr[0],780,120,700), pFit(x,H.fr[1],780,120,700)); pFont(x,700,fs);
  x.fillText(H.fr[0], M, 300); x.fillText(H.fr[1], M, 300+fs*1.06);
  if(en){ x.fillStyle=S.muted; pFont(x,400,42,'italic'); x.fillText(H.en, M, 300+fs*1.06+72); }

  // Bandeau horaire et prix
  const maxT=addHours(l.checkout,4), minP=Math.min(...Object.values(l.prices).map(Number));
  const by=576, bh=170; pRound(x,M,by,W-2*M,bh,36); x.fillStyle=S.chip; x.fill();
  x.fillStyle=S.muted; pFont(x,500,30); x.fillText(en?'Départ · Check-out':'Votre départ', M+48, by+60);
  pFont(x,600,70); x.fillText(l.checkout, M+48, by+138);
  const ow=x.measureText(l.checkout).width; x.fillRect(M+48, by+112, ow, 5); // barré
  x.fillStyle=S.ink; pFont(x,500,62); x.fillText('→', M+48+ow+26, by+136);
  const aw=x.measureText('→').width; x.fillStyle=S.accent; pFont(x,700,70); x.fillText(maxT, M+48+ow+26+aw+26, by+138);
  x.textAlign='right'; x.fillStyle=S.muted; pFont(x,500,30); x.fillText(en?'Dès · From':'À partir de', W-M-48, by+60);
  x.fillStyle=S.ink; pFont(x,700,70); x.fillText(eur(minP), W-M-48, by+138);

  // Carte QR
  const cw=640, chh=en?702:668, cx0=(W-cw)/2, cy0=784;
  x.save(); x.shadowColor='rgba(23,38,29,.16)'; x.shadowBlur=40; x.shadowOffsetY=14; pRound(x,cx0,cy0,cw,chh,44); x.fillStyle=S.card; x.fill(); x.restore();
  pRound(x,cx0+50,cy0+46,cw-100,cw-100,24); x.fillStyle='#FFFFFF'; x.fill();
  if(qr) x.drawImage(qr, cx0+70, cy0+66, cw-140, cw-140);
  x.textAlign='center'; x.fillStyle='#17261D'; pFont(x,600,32); x.fillText('Scannez avec l\'appareil photo', W/2, cy0+cw+6);
  if(en){ x.fillStyle='#66756B'; pFont(x,400,26); x.fillText('Scan with your phone camera', W/2, cy0+cw+44); }

  // Étapes
  const steps=[['Scannez','Scan'],['Choisissez vos heures','Pick your time'],['Payez après accord','Pay once approved']];
  const colW=(W-2*M)/3;
  steps.forEach((s,i)=>{ const sx=M+colW*i+colW/2, sy=1546;
    x.beginPath(); x.arc(sx,sy,30,0,Math.PI*2); x.fillStyle=S.accent; x.fill();
    x.fillStyle=S.bg; pFont(x,700,30); x.fillText(String(i+1), sx, sy+11);
    x.fillStyle=S.ink; pFit(x,s[0],colW-24,30,600); x.fillText(s[0], sx, sy+72);
    if(en){ x.fillStyle=S.muted; pFit(x,s[1],colW-24,24,400); x.fillText(s[1], sx, sy+104); } });

  // Rassurance
  x.fillStyle=S.muted; const foot=`${l.name} · Aucun paiement sans l'accord de votre hôte`;
  pFit(x,foot,W-2*M,24,500); x.fillText(foot, W/2, 1700);
  return c;
}

  else if(r.status==='abandoned') body=`<div class="ico bad">${I.x}</div><h2>Demande non envoyée</h2><p>Le paiement n'a pas été finalisé, rien n'a été prélevé. Vous pouvez refaire une demande.</p>${back}`;
  else if(r.status==='pending' || r.status==='capturing') body=`<div class="ico">${I.clock}</div><h2>Demande envoyée !</h2><p>Votre hôte va examiner votre demande de départ à ${r.newTime}. Cette page se met à jour dès sa réponse, et vous recevrez un e-mail.</p><div class="note">${I.info}<div>${eur(r.price)} sont réservés sur votre carte. Ils ne seront prélevés que si votre hôte accepte.</div></div><div class="mt">${back}</div>`;
  else if(r.status==='accepted' && justPaid) body=`<div class="ico"><span class="spin" style="width:36px;height:36px;border-width:3px"></span></div><h2>Confirmation du paiement…</h2><p>Stripe nous transmet la confirmation de votre paiement. Cela prend généralement quelques secondes.</p>`;
  else if(r.status==='accepted') body=`<div class="ico pop">${I.check}</div><h2>Demande acceptée !</h2><p>Votre hôte accepte un départ à ${r.newTime}. Réglez ${eur(r.price)} avant ${fmtTime(r.payExpiresAt)} pour le confirmer.</p>${r.payToken?`<a class="btn" href="#/pay/${r.payToken}">Payer ${eur(r.price)}</a>`:''}<div class="note warn mt">${I.info}<div>Votre départ tardif n'est confirmé qu'après le paiement.</div></div>`;
  else if(r.status==='paid') body=`<div class="ico pop">${I.check}</div><h2>Votre départ tardif est confirmé !</h2><p>Votre hôte a accepté : vous pouvez rester jusqu'à ${hFmt(r.newTime)}. Une confirmation vous a été envoyée par e-mail.</p><div class="kv" style="text-align:left"><div><span>Date</span><b>${fmtDay(r.date)}</b></div><div><span>Logement</span><b>${esc(l.name||'')}</b></div><div><span>Nouveau départ</span><b>${r.newTime}</b></div><div><span>Montant payé</span><b>${eur2(r.price)}</b></div></div><div class="mt">${back}</div>`;
  else if(r.status==='refused') body=`<div class="ico bad">${I.x}</div><h2>Demande refusée</h2><p>Votre hôte ne peut pas accepter cette demande. Le montant réservé est libéré, rien n'a été prélevé. Merci de libérer le logement à l'heure prévue (${r.oldTime}).</p>${back}`;
  else if(r.status==='refunded') body=`<div class="ico bad">${I.x}</div><h2>Paiement remboursé</h2><p>Votre paiement de ${eur2(r.price)} a été remboursé. Le départ tardif est annulé : départ à ${r.oldTime}.</p>${back}`;
  else body=`<div class="ico bad">${I.clock}</div><h2>${r.status==='cancelled'?'Demande annulée':'Demande expirée'}</h2><p>${r.expiredReason==='payment'?'Le lien de paiement a expiré.':r.status==='cancelled'?"Ce logement n'accepte plus de demandes.":"Votre hôte n'a pas répondu à temps."} Le montant réservé est libéré, rien n'a été prélevé.</p>${back}`;
  page(`${guestTop()}<main class="main"><div class="state">${body}</div></main>`);
  if(['pending','accepted','capturing','awaiting_payment'].includes(r.status) && (r.status!=='awaiting_payment' || justPaid)){
    const st=r.status; const qs='/api/state?rid='+encodeURIComponent(id)+'&rt='+encodeURIComponent(t);
    pollTimer=setInterval(async ()=>{ try{ const s=await api('GET',qs); const x=s.requests.find(z=>z.id===id); if(x && x.status!==st) render(); }catch(e){} }, justPaid ? 1500 : 4000);
  }
});

    +p("<b>Voyageurs</b> : prénom, e-mail, date de départ, durée demandée, message facultatif. Les données de carte sont saisies uniquement sur la page sécurisée de Stripe.")
    +p("<b>Données techniques</b> : un cookie de session strictement nécessaire à la connexion. Aucun cookie publicitaire ni de mesure d'audience.")
    +h('Finalités et bases légales')+p("Fournir le service et traiter les paiements (exécution du contrat) ; envoyer les e-mails et notifications liés aux demandes (exécution du contrat) ; respecter nos obligations comptables et fiscales (obligation légale) ; prévenir la fraude et sécuriser le service (intérêt légitime).")
    +h('Destinataires')+p("L'hôte concerné par la demande ; Stripe (paiements) ; Render (hébergement) ; notre prestataire d'envoi d'e-mails ; Apple (acheminement des notifications). Certains prestataires sont situés hors de l'Union européenne ; les transferts sont encadrés par les clauses contractuelles types de la Commission européenne.")
    +h('Durées de conservation')+p("Compte hôte : jusqu'à sa suppression. Données de transaction : 10 ans (obligations comptables), sous forme anonymisée après suppression du compte. Demandes voyageurs : 3 ans après la date de départ.")
    +h('Vos droits')+p(`Vous disposez des droits d'accès, de rectification, d'effacement, d'opposition, de limitation et de portabilité. Écrivez à ${esc(L.email)}. Les hôtes peuvent supprimer leur compte à tout moment depuis Mon compte. Vous pouvez introduire une réclamation auprès de la CNIL (cnil.fr).`);
  if(kind==='cgu') return p(`Les présentes conditions régissent l'utilisation de LateCheck par les hôtes et conciergeries (« l'Hôte »). Le service est édité par ${ed}.`)
    +h('1. Objet')+p("LateCheck permet à l'Hôte de proposer à ses voyageurs, via un QR code propre à chaque logement, l'achat d'un départ tardif, et d'accepter ou refuser chaque demande.")
    +h("2. Rôle de LateCheck")+p("LateCheck est un intermédiaire technique. Le départ tardif est une prestation fournie par l'Hôte, qui en reste seul responsable vis-à-vis du voyageur (disponibilité du logement, respect de l'horaire accordé, conformité avec son bail ou son règlement de copropriété).")
    +h('3. Inscription')+p("L'Hôte fournit des informations exactes et protège son mot de passe. Un compte est personnel. Pour recevoir des paiements, l'Hôte connecte un compte Stripe et accepte le Contrat de services Stripe Connect.")
    +h('4. Prix et commission')+p("L'inscription est gratuite et sans abonnement. L'Hôte fixe librement ses tarifs. Sur chaque départ tardif payé, LateCheck prélève automatiquement une commission de 10 % ainsi que des frais de paiement, affichés dans l'espace Revenus. Le solde est versé sur le compte Stripe de l'Hôte. Aucune commission n'est due sur une demande refusée, expirée ou remboursée.")
    +h('5. Paiements')+p("Le voyageur réserve le montant sur sa carte au moment de sa demande. Le paiement est encaissé uniquement si l'Hôte accepte ; sinon la réservation est libérée. L'Hôte s'engage à honorer tout départ tardif accepté. Il peut rembourser un voyageur depuis l'application ; la commission est alors annulée, les frais de paiement de Stripe restant perdus.")
    +h('6. Obligations fiscales')+p("Les revenus perçus via LateCheck peuvent être imposables et soumis à cotisations sociales. L'Hôte est seul responsable de leurs déclarations (informations sur impots.gouv.fr et urssaf.fr). Conformément à la réglementation, LateCheck peut être amené à transmettre à l'administration fiscale les montants perçus par l'Hôte.")
    +h('7. Responsabilité et suspension')+p("LateCheck met en œuvre les moyens raisonnables pour assurer la disponibilité du service, sans garantie d'absence d'interruption. LateCheck peut suspendre un compte en cas d'utilisation frauduleuse ou contraire aux présentes.")
    +h('8. Résiliation')+p("L'Hôte peut supprimer son compte à tout moment depuis Mon compte → Supprimer mon compte. Les demandes en cours sont alors annulées et les montants réservés libérés.")
    +h('9. Modifications et droit applicable')+p("Ces conditions peuvent évoluer ; l'Hôte en est informé avant leur entrée en vigueur. Elles sont soumises au droit français.");
  if(kind==='cgv') return p(`Les présentes conditions s'appliquent à l'achat d'un départ tardif par un voyageur (« le Client ») via LateCheck, service édité par ${ed}.`)
    +h('1. Le vendeur')+p("Le départ tardif est vendu et fourni par l'hôte du logement (« l'Hôte »). LateCheck est un intermédiaire technique qui met en relation le Client et l'Hôte et traite le paiement pour le compte de l'Hôte. LateCheck ne garantit pas la disponibilité du logement.")
    +h('2. Prix')+p("Les prix sont fixés par l'Hôte et indiqués toutes taxes comprises avant toute commande. Ils incluent la commission de service de LateCheck, perçue sur la part de l'Hôte : le Client ne paie aucun frais supplémentaire.")
    +h('3. Commande et paiement')+p("Le Client choisit une durée, renseigne son prénom et son e-mail, puis réserve le montant sur sa carte via la page sécurisée de Stripe (carte, Apple Pay, Google Pay). Cette réservation n'est pas un débit. Si l'Hôte accepte, le montant est prélevé et le départ tardif est confirmé par e-mail. Si l'Hôte refuse ou ne répond pas dans le délai indiqué, la réservation est libérée et rien n'est prélevé ; selon les banques, la libération peut prendre quelques jours.")
    +h('4. Exécution')+p("Le départ tardif confirmé autorise le Client à rester dans le logement jusqu'à l'heure indiquée, à la date choisie. Sans confirmation, l'heure de départ habituelle s'applique.")
    +h('5. Droit de rétractation')+p("Conformément à l'article L221-28, 12° du Code de la consommation, le droit de rétractation ne s'applique pas aux prestations de services d'hébergement fournies à une date déterminée.")
    +h('6. Annulation et remboursement')+p(`Si l'Hôte ne peut finalement pas honorer un départ tardif payé, le Client est intégralement remboursé. Pour toute réclamation, contactez l'Hôte ou écrivez à ${esc(L.email)}.`)
    +h('7. Médiation')+p(`En cas de litige non résolu, le Client peut recourir gratuitement au médiateur de la consommation : ${esc(L.mediator)}, ou à la plateforme européenne de règlement en ligne des litiges.`)
    +h('8. Données personnelles et droit applicable')+p("Voir la politique de confidentialité. Les présentes conditions sont soumises au droit français.");
  return '';
}
const legalLinks = () => `<p class="small center mt2"><a href="#/legal/cgu">CGU</a> · <a href="#/legal/cgv">CGV</a> · <a href="#/legal/privacy">Confidentialité</a> · <a href="#/legal/mentions">Mentions légales</a></p>`;
route('/legal/:k', k => {
  if(!LEGAL_TITLES[k]) return go('#/');
  const back = history.length > 1 ? null : '#/';
  page(`<header class="top"><button class="iconbtn" aria-label="Retour" data-act="back">${I.back}</button><h1>${esc(LEGAL_TITLES[k])}</h1><span></span></header><main class="main"><h2 class="title">${esc(LEGAL_TITLES[k])}</h2><p class="small">Dernière mise à jour : octobre 2026</p><div style="font-size:14.5px">${legalHtml(k)}</div>${legalLinks()}</main>`);
});
ACT.back = () => { if(history.length > 1) history.back(); else go('#/'); };

/* ============================ Notifications push (app iOS) ============================ */
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PushPlugin = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
let pushListeners = false;
async function initPush(ask){
  const P = PushPlugin(); if(!isNative() || !P) return 'unsupported';
  try{
    if(!pushListeners){ pushListeners = true;
      P.addListener('registration', t => { api('POST','/api/push/register',{token:t.value}).catch(()=>{}); });
      P.addListener('registrationError', e => console.warn('push', e));
      P.addListener('pushNotificationActionPerformed', a => { const u = a && a.notification && a.notification.data && a.notification.data.url; if(u) location.hash = u.startsWith('#') ? u : '#'+u; });
      P.addListener('pushNotificationReceived', () => { if(STATE.me) render(); });
    }
    let st = (await P.checkPermissions()).receive;
    if(st === 'prompt' && ask) st = (await P.requestPermissions()).receive;
    if(st === 'granted') await P.register();
    return st;
  }catch(e){ console.warn('push', e); return 'error'; }
}
async function pushCard(){
  const box = $('#pushcard'); if(!box) return;
  const st = await initPush(false);
  if(!document.body.contains(box)) return;
  if(st === 'prompt' || st === 'prompt-with-rationale') box.innerHTML = `<div class="note" style="margin-bottom:14px">${I.info}<div><b>Soyez prévenu en quelques secondes.</b><br>Recevez une notification à chaque nouvelle demande.<button class="btn sm mt" data-act="pushon">Activer les notifications</button></div></div>`;
  else if(st === 'denied') box.innerHTML = `<div class="note warn" style="margin-bottom:14px">${I.info}<div>Notifications désactivées. Pour les activer : Réglages de l'iPhone → LateCheck → Notifications.</div></div>`;
  else box.innerHTML = '';
}
ACT.pushon = btn => withLock(btn, async () => { const st = await initPush(true); toast(st==='granted' ? 'Notifications activées' : 'Notifications non autorisées'); pushCard(); });

render();
if(isNative()) setTimeout(()=>{ if(STATE.me && STATE.me.role==='host') initPush(false); }, 1500);
</script>
