<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>LateCheck — Vendez vos départs tardifs</title>
<meta name="description" content="LateCheck permet aux hôtes de locations courte durée et aux conciergeries de vendre des départs tardifs à leurs voyageurs. Un QR code dans le logement, le voyageur réserve, vous acceptez d'un geste. Sans abonnement.">
<meta property="og:title" content="LateCheck — Vendez vos départs tardifs">
<meta property="og:description" content="Un QR code dans le logement, le voyageur réserve, vous acceptez d'un geste. Sans abonnement : 10 % uniquement sur les départs vendus.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LateCheck">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --page:#F3F6F2; --surface:#F6F8F5; --line:#E3E9E2; --ink:#17261D; --muted:#66756B;
  --green:#2E5B43; --green-2:#3E7255; --sage:#A8BDA6; --sage-soft:#EDF3EC; --btn:#2E5B43; --btn-ink:#FFFFFF;
  --danger:#C2412F; --danger-soft:#FBECEA; --warn:#A8661A; --warn-soft:#FCF1E1; --ok:#2E7A4F; --ok-soft:#E6F3EA;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101813; --page:#0B110D; --surface:#17221B; --line:#26352B; --ink:#E8EFE9; --muted:#9BAA9F;
    --green:#7FBF97; --green-2:#94CDA9; --sage:#5E7A62; --sage-soft:#1B2A20; --btn:#5F9E78; --btn-ink:#0D140F;
    --danger:#F08A7A; --danger-soft:#3A1F1B; --warn:#E9B26A; --warn-soft:#332716; --ok:#8FD3A6; --ok-soft:#1A2E21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101813; --page:#0B110D; --surface:#17221B; --line:#26352B; --ink:#E8EFE9; --muted:#9BAA9F;
  --green:#7FBF97; --green-2:#94CDA9; --sage:#5E7A62; --sage-soft:#1B2A20; --btn:#5F9E78; --btn-ink:#0D140F;
  --danger:#F08A7A; --danger-soft:#3A1F1B; --warn:#E9B26A; --warn-soft:#332716; --ok:#8FD3A6; --ok-soft:#1A2E21;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow-x:clip;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
html{background:var(--bg)}
@media (min-width:520px){html,body{background:var(--page)}#app{box-shadow:0 0 0 1px var(--line)}}
#app{width:100%;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}

/* La zone de l'heure et de la batterie reste opaque : le contenu ne défile plus derrière */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:7}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 8px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em}
.top .brand{text-align:left;padding-left:10px;font-size:19px}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{background:var(--surface)}}
.main{flex:1;padding:8px 20px 28px}
.has-nav .main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:12px;position:relative}
.nav a.on{color:var(--green);font-weight:600}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

h2.title{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:10px 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px}
h3.sec{font-size:17px;margin:26px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h3.sec a{font-size:14px;font-weight:600;text-decoration:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:var(--r-md);background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;padding:0 16px;transition:transform 160ms var(--ease-out), opacity 200ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn.busy{opacity:.55;pointer-events:none}
.btn.soft{background:var(--sage-soft);color:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:40px;font-size:14.5px;border-radius:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:10px}

.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.tint{background:var(--sage-soft);border:0;border-radius:var(--r-lg);padding:18px}
.kpi-big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi-label{color:var(--muted);font-size:13.5px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:21px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.trend{font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:999px}
.trend.down{color:var(--danger);background:var(--danger-soft)}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;text-decoration:none;color:inherit;background:var(--bg)}
@media (hover:hover) and (pointer:fine){a.item:hover{border-color:var(--sage)}}
.thumb{width:58px;height:58px;border-radius:11px;object-fit:cover;flex:none;background:var(--sage-soft)}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px}
.amount{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.mute{background:var(--surface);color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--sage-soft);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}

.kv{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:13px 14px}
.kv>div+div{border-top:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.kv .neg{color:var(--danger)}
.kv .total{background:var(--surface)}
.kv .total span:first-child{color:var(--ink);font-weight:600}

label.f{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.input{width:100%;min-height:48px;font-size:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;outline:none}
textarea.input{padding:12px 14px;min-height:84px;resize:vertical}
input.input[type=date],input.input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:48px}
input.input::-webkit-date-and-time-value{text-align:left}
.input:focus{border-color:var(--green);background:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1px}

.photo-pick{position:relative;height:170px;border-radius:var(--r-lg);overflow:hidden;background:var(--sage-soft);display:block;cursor:pointer}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick .lbl{position:absolute;left:12px;bottom:12px;background:rgba(20,30,24,.62);color:#fff;font-size:14px;font-weight:600;padding:8px 12px;border-radius:11px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}

.step{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.step+.step{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.stepper output{min-width:58px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--surface)}

.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;cursor:pointer;margin-bottom:10px}
.choice input{accent-color:var(--green);width:20px;height:20px;margin:0}
.choice.on{border-color:var(--green);background:var(--sage-soft)}
.choice .grow{font-weight:600;font-size:16px}
.choice .t{color:var(--muted);font-size:13px;font-weight:400}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:2px}
.tabs a{flex:none;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);background:var(--surface);padding:7px 13px;border-radius:999px}
.tabs a.on{background:var(--btn);color:var(--btn-ink)}

.hero{margin:0 -20px;height:250px;position:relative;overflow:hidden;background:var(--sage-soft)}
.hero img{width:100%;height:100%;object-fit:cover}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;margin:-26px -20px 0;position:relative;padding:24px 22px 4px;text-align:center}
.sheet h2{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 24px;color:var(--muted);font-size:12.5px}
.features svg{color:var(--green);margin:0 auto 6px;display:block}

.state{text-align:center;padding:40px 6px 10px}
.state .ico{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:var(--sage-soft);color:var(--green)}
.state .ico.bad{background:var(--danger-soft);color:var(--danger)}
.state h2{font-size:25px;margin:0 0 10px;letter-spacing:-.02em}
.state p{color:var(--muted);margin:0 auto 20px;max-width:330px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sage-soft);border-radius:var(--r-md);padding:13px 14px;text-align:left;font-size:14px;color:var(--ink)}
.note svg{flex:none;color:var(--green);margin-top:1px}
.note.warn{background:var(--warn-soft)} .note.warn svg{color:var(--warn)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px}

.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.chart i{flex:1;background:var(--sage);border-radius:3px 3px 0 0;min-height:2px}
.chart i.hi{background:var(--green)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}

.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background-color 200ms ease}
.toggle span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 220ms var(--ease-out)}
.toggle input:checked+span{background:var(--green-2)}
.toggle input:checked+span::before{transform:translateX(20px)}
.menu{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.menu>*{display:flex;align-items:center;gap:12px;padding:15px 14px;text-decoration:none;color:inherit;background:none;border:0;width:100%;text-align:left;cursor:pointer;font-size:15px}
.menu>*+*{border-top:1px solid var(--line)}
.menu .chev{margin-left:auto;color:var(--muted)}
.menu .red{color:var(--danger)}

.qrbox{border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;place-items:center;background:#fff}
.qrbox canvas,.qrbox img{width:200px!important;height:200px!important}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.auth-ill{width:96px;height:96px;margin:30px auto 18px;color:var(--green)}
.center{text-align:center}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:18px}.mt2{margin-top:28px}
.small{font-size:13px;color:var(--muted)}
.cardnum{letter-spacing:.06em}
.applepay{background:#000;color:#fff}
:root[data-theme="dark"] .applepay{background:#fff;color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .applepay{background:#fff;color:#000}}

.poster-frame{background:var(--surface);border-radius:var(--r-lg);padding:24px 16px;display:grid;place-items:center}
.poster-frame img{width:min(100%,300px);aspect-ratio:1240/1754;border-radius:6px;background:#fff;box-shadow:0 18px 40px rgba(23,38,29,.18),0 2px 6px rgba(23,38,29,.12)}
.optrow{margin-top:14px}.optrow>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--btn);color:var(--btn-ink)}
.share-ov{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.share-box{background:var(--bg);border-radius:22px;padding:20px;width:100%;max-width:456px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#intro{position:fixed;inset:0;z-index:100;background:#F4F8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#intro .stage{display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
#intro svg{width:min(52vw,230px);height:auto;overflow:visible}
#intro .arc{stroke-dasharray:1;stroke-dashoffset:1;animation:lcDraw .62s cubic-bezier(.55,0,.25,1) .08s forwards}
#intro .chk{stroke-dasharray:1;stroke-dashoffset:1;animation:lcDraw .34s cubic-bezier(.4,0,.2,1) .98s forwards}
#intro .hands{opacity:0;transform:scale(.5);animation:lcGrow .34s cubic-bezier(.34,1.4,.64,1) .42s forwards}
#intro .mn{animation:lcSpin .6s cubic-bezier(.65,0,.35,1) .6s both}
#intro .logo{animation:lcPop .42s cubic-bezier(.3,1.6,.5,1) 1.22s both}
#intro.out .stage{animation:lcZoom .46s var(--ease-in-out) forwards}
#intro.out{animation:lcFade .28s var(--ease-out) .16s forwards}
@keyframes lcDraw{to{stroke-dashoffset:0}}
@keyframes lcGrow{to{opacity:1;transform:scale(1)}}
@keyframes lcSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes lcPop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes lcZoom{0%{transform:scale(1)}22%{transform:scale(.94)}100%{transform:scale(12);opacity:0}}
@keyframes lcFade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){#intro *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}#intro.out .stage{animation:none!important}#intro.out{animation:lcFade .3s forwards!important}}
/* Comportement natif sur téléphone (skill mobile-native) */
a,button,label,.btn,[role="button"]{touch-action:manipulation}
.btn,.iconbtn,.nav a,.tabs a,.chips button,.choice,.stepper button,.menu>a,.menu>button,.menu>label,a.stat,a.item,.pill,.toggle{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a.item,a.stat,.choice,.chips button,.tabs a,.iconbtn,.stepper button,.nav a{transition:transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease}
a.item:active,a.stat:active,.choice:active{transform:scale(.98)}
.chips button:active,.tabs a:active,.stepper button:active{transform:scale(.95)}
.iconbtn:active{transform:scale(.92)}
.nav a:active{transform:scale(.94)}
.menu>a,.menu>button,.menu>label{transition:background-color 120ms ease}
.menu>a:active,.menu>button:active,.menu>label:active{background:var(--surface)}
.share-ov{animation:ovIn 200ms var(--ease-out) both}
.share-box{animation:sheetIn 420ms var(--ease-drawer) both}
.share-ov.closing{animation:ovOut 160ms ease-out both}
.share-ov.closing .share-box{animation:sheetOut 180ms var(--ease-out) both}
@keyframes ovIn{from{opacity:0}}
@keyframes ovOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important}
  .pop,.share-box,.share-ov.closing .share-box{animation:ovIn 200ms ease both!important}
}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity 150ms ease-out, transform 150ms ease-out;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);transition-duration:240ms;transition-timing-function:var(--ease-out)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop 380ms cubic-bezier(.34,1.4,.64,1) both}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.spin{animation:none}.btn{transition:none}}

/* ---------- Page d'accueil commerciale ---------- */
#app.wide{max-width:1080px;box-shadow:none}
html:has(#app.wide),html:has(#app.wide) body{background:var(--bg)}
.lp{padding:0 20px 40px}
.lp-nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.lp-logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.lp-logo svg{width:28px;height:28px;color:var(--green)}
.lp-nav .btn{width:auto;min-height:40px;font-size:14.5px;border-radius:12px}
.lp-hero{display:grid;gap:34px;align-items:center;padding:26px 0 12px}
.lp-eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--green);background:var(--sage-soft);padding:5px 12px;border-radius:999px;margin-bottom:16px}
.lp h1{font-size:clamp(34px,7.4vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 16px;font-weight:700;text-wrap:balance}
.lp-lead{font-size:clamp(16px,2.2vw,19px);color:var(--muted);margin:0 0 24px;max-width:520px;text-wrap:pretty}
.lp-cta{display:flex;flex-wrap:wrap;gap:10px}
.lp-cta .btn{width:auto;flex:1 1 200px;max-width:280px}
.lp-fine{font-size:13px;color:var(--muted);margin:14px 0 0}
.lp-visual{position:relative;max-width:360px;width:100%;margin:0 auto;padding:6px 0 92px}
.lp-poster{background:#EEF3EC;color:#17261D;border-radius:22px;padding:24px 22px 22px;box-shadow:0 30px 60px rgba(23,38,29,.16),0 4px 12px rgba(23,38,29,.08);transform:rotate(-2deg)}
.lp-poster small{font-weight:700;color:#2E5B43;font-size:13px}
.lp-poster strong{display:block;font-size:30px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 14px}
.lp-time{display:flex;justify-content:space-between;align-items:center;background:#DCE7DA;border-radius:14px;padding:12px 14px;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.lp-time s{color:#7C8A80;font-weight:600}.lp-time i{font-style:normal;color:#2E5B43}
.lp-qr{background:#fff;border-radius:16px;margin-top:14px;padding:16px 16px 44px;display:grid;place-items:center}
.lp-qr svg{width:132px;height:132px;color:#17261D}
.lp-notif{position:absolute;right:-6px;bottom:0;width:min(280px,86%);background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:0 18px 40px rgba(23,38,29,.18);animation:lpIn 700ms var(--ease-out) 300ms both}
.lp-notif b{display:block;font-size:14px}.lp-notif>span{font-size:13px;color:var(--muted)}
.lp-notif .row2{margin-top:10px;gap:8px}.lp-notif .btn{min-height:34px;font-size:13.5px;border-radius:10px;pointer-events:none}
@keyframes lpIn{from{opacity:0;transform:translateY(14px)}}
.lp-sec{padding:44px 0 0}
.lp-sec h2{font-size:clamp(25px,4.4vw,34px);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px;text-wrap:balance}
.lp-sec>p{color:var(--muted);margin:0 0 22px;max-width:560px}
.lp-grid{display:grid;gap:12px}
.lp-step{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.lp-step .n{width:32px;height:32px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.lp-step b{display:block;font-size:17px;margin-bottom:4px}.lp-step span{color:var(--muted);font-size:14.5px}
.lp-two{display:grid;gap:12px}
.lp-box{background:var(--surface);border-radius:var(--r-lg);padding:22px}
.lp-box h3{margin:0 0 12px;font-size:18px}
.lp-box ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.lp-box li{display:flex;gap:10px;font-size:15px}.lp-box li svg{flex:none;width:20px;height:20px;color:var(--green);margin-top:1px}
.lp-sim{background:var(--sage-soft);border-radius:var(--r-lg);padding:22px;display:grid;gap:20px}
.lp-sim label{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600;margin-bottom:6px}
.lp-sim input[type=range]{width:100%;accent-color:var(--green);height:30px;touch-action:pan-y}
.lp-sim .res{background:var(--bg);border-radius:var(--r-md);padding:18px;text-align:center}
.lp-sim .res b{display:block;font-size:40px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.lp-sim .res span{color:var(--muted);font-size:13.5px}
.lp-faq details{border-bottom:1px solid var(--line);padding:4px 0}
.lp-faq summary{cursor:pointer;font-weight:600;font-size:16px;padding:14px 28px 14px 0;list-style:none;position:relative}
.lp-faq summary::-webkit-details-marker{display:none}
.lp-faq summary::after{content:"+";position:absolute;right:4px;top:10px;font-size:22px;font-weight:400;color:var(--muted);transition:transform 200ms var(--ease-out)}
.lp-faq details[open] summary::after{transform:rotate(45deg)}
.lp-faq p{margin:0 0 16px;color:var(--muted);max-width:640px}
.lp-end{margin-top:48px;background:var(--btn);color:var(--btn-ink);border-radius:26px;padding:34px 22px;text-align:center}
.lp-end h2{margin:0 0 8px;font-size:clamp(24px,4.4vw,32px);letter-spacing:-.03em}
.lp-end p{margin:0 0 20px;opacity:.85}
.lp-end .btn{background:var(--bg);color:var(--ink);width:auto;display:inline-flex;padding:0 26px}
.lp-foot{padding:26px 0 0;text-align:center;font-size:13px;color:var(--muted)}
@media (min-width:860px){
  .lp{padding:0 40px 60px}
  .lp-hero{grid-template-columns:1.15fr .85fr;padding:56px 0 30px}
  .lp-grid{grid-template-columns:repeat(3,1fr)}.lp-two{grid-template-columns:1fr 1fr}
  .lp-sim{grid-template-columns:1.2fr .8fr;align-items:center;padding:30px}
  .lp-sec{padding-top:72px}
}
@media (prefers-reduced-motion:reduce){.lp-notif{animation:none}}

.top.gt{grid-template-columns:44px 1fr 44px}
.langfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.langfab[hidden]{display:none}
.langfab.up{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.langfab.tp{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 10px);right:58px}

.langfab.tp .langmenu{order:1}

.langmenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:9px;background:none;color:var(--ink);font:500 16px/1.2 inherit;font-family:inherit;cursor:pointer}
.langmenu button.on{font-weight:700;background:rgba(0,0,0,.05)}
@media print{.langfab{display:none}}
.langsel{justify-self:end;width:60px;height:36px;padding:0 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 16px/1 inherit;font-family:inherit;text-overflow:ellipsis;touch-action:manipulation}

@media print{

  #print-area img{display:block;width:100%!important;height:209mm!important;object-fit:contain;margin:0!important}
  @page{size:A5 portrait;margin:0}
}

const $ = (s, r=document) => r.querySelector(s);

async function api(method, url, body){

  catch(e){ throw Object.assign(new Error('Connexion au serveur impossible. Vérifiez votre réseau.'), {network:true}); }

  if(!r.ok) throw Object.assign(new Error(data.error || 'Une erreur est survenue.'), {status:r.status, code:data.code});

function stateQuery(path){
  const p = new URLSearchParams(); let m;

const app = $('#app');
let pollTimer = null, renderSeq = 0;
const ROUTES = [];
const route = (pattern, fn) => ROUTES.push({re:new RegExp('^'+pattern.replace(/:[a-z]+/g,'([^/?]+)')+'(?:\\?[^#]*)?$'), fn});

async function render(){
  clearInterval(pollTimer); pollTimer = null;
  const path = location.hash.replace(/^#/,'') || '/';
  const seq = ++renderSeq;
  try{ STATE = await api('GET', '/api/state?' + stateQuery(path)); }
  catch(e){ if(seq!==renderSeq) return;
    page(`<main class="main"><div class="state"><div class="ico bad">${I.x}</div><h2>Serveur injoignable</h2><p>${esc(e.message)}</p><button class="btn" data-act="retry">Réessayer</button></div></main>`); return; }
  if(seq !== renderSeq) return;
  for(const r of ROUTES){ const m = path.match(r.re); if(m){ r.fn(...m.slice(1).map(x => x===undefined ? x : decodeURIComponent(x))); if(!render._keep) window.scrollTo(0,0); render._keep = false; hostWatch(path); return; } }
  go('#/');
}
/* Espace hôte : les nouvelles demandes apparaissent seules (toutes les 20 s, et au retour sur la page) */
const HOST_LIVE = /^\/h(\/requests(\/tab\/\w+)?)?$/;
const hostSig = s => (s.requests||[]).map(r => r.id+':'+r.status).join('|');
function hostWatch(path){
  if(pollTimer || !STATE.me || STATE.me.role!=='host' || !HOST_LIVE.test(path)) return;
  const sig = hostSig(STATE);
  pollTimer = setInterval(async () => { if(document.hidden) return; try{ const s = await api('GET','/api/state'); if(hostSig(s) !== sig){ render._keep = true; render(); } }catch(e){} }, 20000);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && STATE.me && STATE.me.role==='host' && HOST_LIVE.test(location.hash.replace(/^#/,''))){ render._keep = true; render(); } });
const ACT = {};
ACT.retry = () => render();
window.addEventListener('hashchange', render);
window.addEventListener('scroll', () => { const t=$('.top'); if(t) t.classList.toggle('scrolled', window.scrollY>4); }, {passive:true});

function topBar({title='LateCheck', back=null, brand=false, right=''}={}){
  return `<header class="top">${back?`<button class="iconbtn" aria-label="Retour" data-go="${esc(back)}">${I.back}</button>`:'<span></span>'}
  <h1 class="${brand?'brand':''}" ${brand?'style="grid-column:1/3"':''}>${esc(title)}</h1>${right||'<span></span>'}</header>`;
}
function page(html, {nav=null, wide=false}={}){ const me = (typeof STATE !== 'undefined' && STATE) ? STATE.me : null; const marked = html.includes('data-lang-ui'); const multi = marked || !me || me.role==='host'; document.documentElement.lang = multi ? LANG : 'fr'; app.className = (nav ? 'has-nav' : '') + (wide ? ' wide' : ''); app.innerHTML = html + (nav||''); syncLangFab(multi, !!nav, !!(me && me.role==='host' && !marked)); if(!marked) hxNode(app); }
function hostNav(active, db, u){
  const pending = hostRequests(db,u.id).filter(r=>r.status==='pending').length;
  const it = (k,h,ic,l,b) => `<a href="${h}" class="${active===k?'on':''}">${ic}${b?`<span class="badge">${b}</span>`:''}${l}</a>`;
  return `<nav class="nav" aria-label="Navigation">${it('home','#/h',I.home,'Accueil')}${it('req','#/h/requests',I.chat,'Demandes',pending)}${it('lst','#/h/listings',I.house,'Logements')}${it('rev','#/h/revenue',I.euro,'Revenus')}</nav>`;
}
function adminNav(active){
  const it = (k,h,ic,l) => `<a href="${h}" class="${active===k?'on':''}">${ic}${l}</a>`;
  return `<nav class="nav" aria-label="Navigation">${it('home','#/a',I.home,'Accueil')}${it('hosts','#/a/hosts',I.users,'Hôtes')}${it('tx','#/a/tx',I.list,'Transactions')}${it('rev','#/a/revenue',I.euro,'Revenus')}</nav>`;
}
function guard(role){
  const db = STATE, u = db.me;
  if(!u){ go('#/login'); return null; }
  if(u.role!==role){ go(u.role==='admin'?'#/a':'#/h'); return null; }
  return {db,u};
}
function chart(values, labels){
  const max = Math.max(1, ...values); const hi = values.indexOf(Math.max(...values));
  return `<div class="chart" role="img" aria-label="Graphique d'évolution">${values.map((v,i)=>`<i class="${i===hi&&v>0?'hi':''}" style="height:${Math.max(2,Math.round(v/max*100))}%" title="${esc(labels[i])} : ${eur2(v)}"></i>`).join('')}</div>
  <div class="axis"><span>${esc(labels[0])}</span><span>${esc(labels[Math.floor(labels.length/2)])}</span><span>${esc(labels[labels.length-1])}</span></div>`;
}
function daysSeries(payments, days, field){
  const vals=[], labels=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const s=d.getTime(), e=s+86400000;
    vals.push(sum(payments.filter(p=>ok(p)&&p.createdAt>=s&&p.createdAt<e), p=>p[field])); labels.push(d.toLocaleDateString(HL(),{day:'numeric',month:'short'})); }
  return {vals, labels};
}
const statusPill = s => ({
  pending:'<span class="pill warn">En attente</span>', accepted:'<span class="pill warn">Paiement attendu</span>',
  paid:'<span class="pill ok">Payée</span>', refused:'<span class="pill bad">Refusée</span>', expired:'<span class="pill mute">Expirée</span>',
  refunded:'<span class="pill mute">Remboursée</span>', cancelled:'<span class="pill mute">Annulée</span>', capturing:'<span class="pill warn">Encaissement…</span>', awaiting_payment:'<span class="pill warn">Paiement à finaliser</span>', abandoned:'<span class="pill mute">Non finalisée</span>',
  succeeded:'<span class="pill ok">Réussi</span>', failed:'<span class="pill bad">Échoué</span>'
}[s] || '');
const methodLabel = p => p.method==='apple_pay' ? 'Apple Pay' : p.method==='google_pay' ? 'Google Pay' : p.last4 ? 'Carte •••• '+esc(p.last4) : 'Carte';

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if(a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a, e); }
});
async function withLock(btn, fn){
  if(!btn || btn.classList.contains('busy')) return;
  const html = btn.innerHTML; btn.classList.add('busy'); btn.innerHTML = '<span class="spin"></span>';
  try{ await fn(); }
  catch(e){ toast(e.message); }
  finally{ if(document.body.contains(btn)){ btn.classList.remove('busy'); btn.innerHTML = html; } }
}
async function submitForm(btn, errEl, fn){
  if(btn.classList.contains('busy')) return; errEl.textContent=''; const html=btn.innerHTML; btn.classList.add('busy'); btn.innerHTML='<span class="spin"></span>';
  try{ await fn(); } catch(e){ errEl.textContent = g(e.message); } finally { if(document.body.contains(btn)){ btn.classList.remove('busy'); btn.innerHTML=html; } }
}

/* PDF A5 d'une seule page, sans en-tête ni pied de page : l'affiche JPEG occupe toute la page */
async function posterPdfBlob(canvas){
  const jpg = new Uint8Array(await (await new Promise(r=>canvas.toBlob(r,'image/jpeg',.92))).arrayBuffer());
  const enc = new TextEncoder(), W=419.53, H=595.28, parts=[], offs=[]; let len=0;
  const add = x => { const u = typeof x==='string' ? enc.encode(x) : x; parts.push(u); len += u.length; };
  const obj = (n, body) => { offs[n]=len; add(n+' 0 obj\n'); add(body); add('\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4]=len; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n'); add(jpg); add('\nendstream\nendobj\n');
  const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xref=len; let x='xref\n0 6\n0000000000 65535 f \n'; for(let i=1;i<=5;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(parts, {type:'application/pdf'});
}

  x.lineWidth=14; x.strokeStyle=S.accent; x.stroke();
  x.lineCap='round'; x.lineWidth=14;
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx, cy-78); x.stroke();                       // minutes : 12
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(-Math.PI/6)*58, cy+Math.sin(-Math.PI/6)*58); x.stroke(); // heures : ~2
  x.beginPath(); x.arc(cx,cy,10,0,Math.PI*2); x.fillStyle=S.accent; x.fill();

  x.fillText(H.fr[0], M, 300); x.fillText(H.fr[1], M, 300+fs*1.06);

  pFont(x,600,70); x.fillText(l.checkout, M+48, by+138);
  const ow=x.measureText(l.checkout).width; x.fillRect(M+48, by+112, ow, 5); // barré
  x.fillStyle=S.ink; pFont(x,500,62); x.fillText('→', M+48+ow+26, by+136);
  const aw=x.measureText('→').width; x.fillStyle=S.accent; pFont(x,700,70); x.fillText(maxT, M+48+ow+26+aw+26, by+138);
  x.textAlign='right'; x.fillStyle=S.muted; pFont(x,500,30); x.fillText(en?'Dès · From':'À partir de', W-M-48, by+60);
  x.fillStyle=S.ink; pFont(x,700,70); x.fillText(eur(minP), W-M-48, by+138);

  // Carte QR
  const cw=640, chh=en?702:668, cx0=(W-cw)/2, cy0=784;
  x.save(); x.shadowColor='rgba(23,38,29,.16)'; x.shadowBlur=40; x.shadowOffsetY=14; pRound(x,cx0,cy0,cw,chh,44); x.fillStyle=S.card; x.fill(); x.restore();
  pRound(x,cx0+50,cy0+46,cw-100,cw-100,24); x.fillStyle='#FFFFFF'; x.fill();
  if(qr) x.drawImage(qr, cx0+70, cy0+66, cw-140, cw-140);
  x.textAlign='center'; x.fillStyle='#17261D'; pFont(x,600,32); x.fillText('Scannez avec l\'appareil photo', W/2, cy0+cw+6);
  if(en){ x.fillStyle='#66756B'; pFont(x,400,26); x.fillText('Scan with your phone camera', W/2, cy0+cw+44); }

  // Étapes
  const steps=[['Scannez','Scan'],['Choisissez vos heures','Pick your time'],['Payez après accord','Pay once approved']];
  const colW=(W-2*M)/3;
  steps.forEach((s,i)=>{ const sx=M+colW*i+colW/2, sy=1546;
    x.beginPath(); x.arc(sx,sy,30,0,Math.PI*2); x.fillStyle=S.accent; x.fill();
    x.fillStyle=S.bg; pFont(x,700,30); x.fillText(String(i+1), sx, sy+11);
    x.fillStyle=S.ink; pFit(x,s[0],colW-24,30,600); x.fillText(s[0], sx, sy+72);
    if(en){ x.fillStyle=S.muted; pFit(x,s[1],colW-24,24,400); x.fillText(s[1], sx, sy+104); } });

  // Rassurance
  x.fillStyle=S.muted; const foot=`${l.name} · Aucun paiement sans l'accord de votre hôte`;
  pFit(x,foot,W-2*M,24,500); x.fillText(foot, W/2, 1700);
  return c;
}

/* Partage natif (app iOS) : la vue web d'Apple bloque impression et téléchargement directs */
async function shareOrOffer(file, title, fallback){
  let can=false; try{ can=!!(navigator.share && navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  if(!can){ fallback(); return; }
  try{ await navigator.share({files:[file], title}); }
  catch(e){ if(e && e.name==='AbortError') return; if(e && e.name==='NotAllowedError'){ offerShare(file,title); return; } fallback(); }
}
function offerShare(file, title){
  const d=document.createElement('div'); d.className='share-ov';
  d.innerHTML=`<div class="share-box"><div class="name" style="font-size:17px">${esc(title)}</div><p class="small" style="margin:6px 0 14px">Votre document est prêt.</p><button class="btn" data-x="s">${I.dl} Imprimer, enregistrer ou partager</button><button class="btn ghost mt" data-x="c">Fermer</button></div>`;
  document.body.appendChild(d);
  const close=()=>{ if(d.classList.contains('closing')) return; d.classList.add('closing'); setTimeout(()=>d.remove(),190); };
  d.onclick=async e=>{ const x=e.target.closest('[data-x]'); if(e.target===d || (x && x.dataset.x==='c')) return close(); if(x && x.dataset.x==='s'){ try{ await navigator.share({files:[file],title}); }catch(_){} close(); } };
}
/* Impression directe AirPrint (module natif LatePrint de l'app iOS) */
function LatePrint(){
  const C=window.Capacitor; if(!C || !isNative()) return null;
  try{ if(C.isPluginAvailable && !C.isPluginAvailable('LatePrint')) return null; return C.registerPlugin ? C.registerPlugin('LatePrint') : (C.Plugins && C.Plugins.LatePrint) || null; }catch(e){ return null; }
}
const blobToBase64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
async function nativePrint(blob, type, name){
  const P=LatePrint(); if(!P) return false;

}

  else if(r.status==='paid') body=`<div class="ico pop">${I.check}</div><h2>${g('Votre départ tardif est confirmé !')}</h2><p>${g("Votre hôte a accepté : vous pouvez rester jusqu'à {0}. Une confirmation vous a été envoyée par e-mail.", LANG==='fr' ? hFmt(r.newTime) : r.newTime)}</p><div class="kv" style="text-align:left"><div><span>${g('Date')}</span><b>${gDay(r.date)}</b></div><div><span>${g('Logement')}</span><b>${esc(l.name||'')}</b></div><div><span>${g('Nouveau départ')}</span><b>${r.newTime}</b></div><div><span>${g('Montant payé')}</span><b>${gEur2(r.price)}</b></div></div><div class="mt">${back}</div>`;
  else if(r.status==='refused') body=`<div class="ico bad">${I.x}</div><h2>${g('Demande refusée')}</h2><p>${g("Votre hôte ne peut pas accepter cette demande. Le montant réservé est libéré, rien n'a été prélevé. Merci de libérer le logement à l'heure prévue ({0}).", r.oldTime)}</p>${back}`;
  else if(r.status==='refunded') body=`<div class="ico bad">${I.x}</div><h2>${g('Paiement remboursé')}</h2><p>${g('Votre paiement de {0} a été remboursé. Le départ tardif est annulé : départ à {1}.', gEur2(r.price), r.oldTime)}</p>${back}`;
  else body=`<div class="ico bad">${I.clock}</div><h2>${r.status==='cancelled'?g('Demande annulée'):g('Demande expirée')}</h2><p>${r.expiredReason==='payment'?g('La réservation du paiement a expiré.'):r.status==='cancelled'?g("Ce logement n'accepte plus de demandes."):g("Votre hôte n'a pas répondu à temps.")} ${freed}</p>${back}`;
  page(`${guestTop()}<main class="main"><div class="state">${body}</div></main>`);
  if(['pending','accepted','capturing','awaiting_payment'].includes(r.status) && (r.status!=='awaiting_payment' || justPaid)){
    const st=r.status; const qs='/api/state?rid='+encodeURIComponent(id)+'&rt='+encodeURIComponent(t);
    pollTimer=setInterval(async ()=>{ try{ const s=await api('GET',qs); const x=s.requests.find(z=>z.id===id); if(x && x.status!==st) render(); }catch(e){} }, justPaid ? 1500 : 4000);
  }
});

    +h('Données collectées')+p("<b>Hôtes</b> : nom, e-mail, mot de passe (stocké chiffré), logements (nom, adresse, photo, horaires, tarifs), historique des demandes et paiements, identifiant de l'appareil pour les notifications si vous les activez. Votre identité et votre RIB sont collectés et conservés par Stripe, pas par LateCheck.")
    +p("<b>Voyageurs</b> : prénom, e-mail, date de départ, durée demandée, message facultatif. Les données de carte sont saisies uniquement sur la page sécurisée de Stripe.")
    +p("<b>Données techniques</b> : un cookie de session strictement nécessaire à la connexion. Aucun cookie publicitaire ni de mesure d'audience.")
    +h('Finalités et bases légales')+p("Fournir le service et traiter les paiements (exécution du contrat) ; envoyer les e-mails et notifications liés aux demandes (exécution du contrat) ; respecter nos obligations comptables et fiscales (obligation légale) ; prévenir la fraude et sécuriser le service (intérêt légitime).")
    +h('Destinataires')+p("L'hôte concerné par la demande ; Stripe (paiements) ; Render (hébergement) ; notre prestataire d'envoi d'e-mails ; Apple (acheminement des notifications). Certains prestataires sont situés hors de l'Union européenne ; les transferts sont encadrés par les clauses contractuelles types de la Commission européenne.")
    +h('Durées de conservation')+p("Compte hôte : jusqu'à sa suppression. Données de transaction : 10 ans (obligations comptables), sous forme anonymisée après suppression du compte. Demandes voyageurs : 3 ans après la date de départ.")
    +h('Vos droits')+p(`Vous disposez des droits d'accès, de rectification, d'effacement, d'opposition, de limitation et de portabilité. Écrivez à ${esc(L.email)}. Les hôtes peuvent supprimer leur compte à tout moment depuis Mon compte. Vous pouvez introduire une réclamation auprès de la CNIL (cnil.fr).`);
  if(kind==='cgu') return p(`Les présentes conditions régissent l'utilisation de LateCheck par les hôtes et conciergeries (« l'Hôte »). Le service est édité par ${ed}.`)
    +h('1. Objet')+p("LateCheck permet à l'Hôte de proposer à ses voyageurs, via un QR code propre à chaque logement, l'achat d'un départ tardif, et d'accepter ou refuser chaque demande.")
    +h("2. Rôle de LateCheck")+p("LateCheck est un intermédiaire technique. Le départ tardif est une prestation fournie par l'Hôte, qui en reste seul responsable vis-à-vis du voyageur (disponibilité du logement, respect de l'horaire accordé, conformité avec son bail ou son règlement de copropriété).")
    +h('3. Inscription')+p("L'Hôte fournit des informations exactes et protège son mot de passe. Un compte est personnel. Pour recevoir des paiements, l'Hôte connecte un compte Stripe et accepte le Contrat de services Stripe Connect.")
    +h('4. Prix et commission')+p("L'inscription est gratuite et sans abonnement. L'Hôte fixe librement ses tarifs. Sur chaque départ tardif payé, LateCheck prélève automatiquement une commission de 10 % ainsi que des frais de paiement, affichés dans l'espace Revenus. Le solde est versé sur le compte Stripe de l'Hôte. Aucune commission n'est due sur une demande refusée, expirée ou remboursée.")
    +h('5. Paiements')+p("Le voyageur réserve le montant sur sa carte au moment de sa demande. Le paiement est encaissé uniquement si l'Hôte accepte ; sinon la réservation est libérée. L'Hôte s'engage à honorer tout départ tardif accepté. Il peut rembourser un voyageur depuis l'application ; la commission est alors annulée, les frais de paiement de Stripe restant perdus.")
    +h('6. Obligations fiscales')+p("Les revenus perçus via LateCheck peuvent être imposables et soumis à cotisations sociales. L'Hôte est seul responsable de leurs déclarations (informations sur impots.gouv.fr et urssaf.fr). Conformément à la réglementation, LateCheck peut être amené à transmettre à l'administration fiscale les montants perçus par l'Hôte.")
    +h('7. Responsabilité et suspension')+p("LateCheck met en œuvre les moyens raisonnables pour assurer la disponibilité du service, sans garantie d'absence d'interruption. LateCheck peut suspendre un compte en cas d'utilisation frauduleuse ou contraire aux présentes.")
    +h('8. Résiliation')+p("L'Hôte peut supprimer son compte à tout moment depuis Mon compte → Supprimer mon compte. Les demandes en cours sont alors annulées et les montants réservés libérés.")
    +h('9. Modifications et droit applicable')+p("Ces conditions peuvent évoluer ; l'Hôte en est informé avant leur entrée en vigueur. Elles sont soumises au droit français.");
  if(kind==='cgv') return p(`Les présentes conditions s'appliquent à l'achat d'un départ tardif par un voyageur (« le Client ») via LateCheck, service édité par ${ed}.`)
    +h('1. Le vendeur')+p("Le départ tardif est vendu et fourni par l'hôte du logement (« l'Hôte »). LateCheck est un intermédiaire technique qui met en relation le Client et l'Hôte et traite le paiement pour le compte de l'Hôte. LateCheck ne garantit pas la disponibilité du logement.")
    +h('2. Prix')+p("Les prix sont fixés par l'Hôte et indiqués toutes taxes comprises avant toute commande. Ils incluent la commission de service de LateCheck, perçue sur la part de l'Hôte : le Client ne paie aucun frais supplémentaire.")
    +h('3. Commande et paiement')+p("Le Client choisit une durée, renseigne son prénom et son e-mail, puis réserve le montant sur sa carte via la page sécurisée de Stripe (carte, Apple Pay, Google Pay). Cette réservation n'est pas un débit. Si l'Hôte accepte, le montant est prélevé et le départ tardif est confirmé par e-mail. Si l'Hôte refuse ou ne répond pas dans le délai indiqué, la réservation est libérée et rien n'est prélevé ; selon les banques, la libération peut prendre quelques jours.")
    +h('4. Exécution')+p("Le départ tardif confirmé autorise le Client à rester dans le logement jusqu'à l'heure indiquée, à la date choisie. Sans confirmation, l'heure de départ habituelle s'applique.")
    +h('5. Droit de rétractation')+p("Conformément à l'article L221-28, 12° du Code de la consommation, le droit de rétractation ne s'applique pas aux prestations de services d'hébergement fournies à une date déterminée.")
    +h('6. Annulation et remboursement')+p(`Si l'Hôte ne peut finalement pas honorer un départ tardif payé, le Client est intégralement remboursé. Pour toute réclamation, contactez l'Hôte ou écrivez à ${esc(L.email)}.`)
    +h('7. Médiation')+p(`En cas de litige non résolu, le Client peut recourir gratuitement au médiateur de la consommation : ${esc(L.mediator)}, ou à la plateforme européenne de règlement en ligne des litiges.`)
    +h('8. Données personnelles et droit applicable')+p("Voir la politique de confidentialité. Les présentes conditions sont soumises au droit français.");
  return '';
}
const legalLinks = () => `<p class="small center mt2"><a href="#/legal/cgu">CGU</a> · <a href="#/legal/cgv">CGV</a> · <a href="#/legal/privacy">Confidentialité</a> · <a href="#/legal/mentions">Mentions légales</a></p>`;
route('/legal/:k', k => {
  if(!LEGAL_TITLES[k]) return go('#/');
  const back = history.length > 1 ? null : '#/';
  page(`<header class="top"><button class="iconbtn" aria-label="Retour" data-act="back">${I.back}</button><h1>${esc(LEGAL_TITLES[k])}</h1><span></span></header><main class="main"><h2 class="title">${esc(LEGAL_TITLES[k])}</h2><p class="small">Dernière mise à jour : octobre 2026</p><div style="font-size:14.5px">${legalHtml(k)}</div>${legalLinks()}</main>`);
});
ACT.back = () => { if(history.length > 1) history.back(); else go('#/'); };

/* ============================ Notifications push (app iOS) ============================ */
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PushPlugin = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
let pushListeners = false;
async function initPush(ask){
  const P = PushPlugin(); if(!isNative() || !P) return 'unsupported';
  try{
    if(!pushListeners){ pushListeners = true;
      P.addListener('registration', t => { api('POST','/api/push/register',{token:t.value}).catch(()=>{}); });
      P.addListener('registrationError', e => console.warn('push', e));
      P.addListener('pushNotificationActionPerformed', a => { const u = a && a.notification && a.notification.data && a.notification.data.url; if(u) location.hash = u.startsWith('#') ? u : '#'+u; });
      P.addListener('pushNotificationReceived', () => { if(STATE.me) render(); });
    }
    let st = (await P.checkPermissions()).receive;
    if(st === 'prompt' && ask) st = (await P.requestPermissions()).receive;
    if(st === 'granted') await P.register();
    return st;
  }catch(e){ console.warn('push', e); return 'error'; }
}
const isStandalone = () => { try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){ return false; } };
const isIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const webPushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;
async function swReady(){ if(!swReg) swReg = await navigator.serviceWorker.register('/sw.js'); return swReg; }
const b64uBytes = t => { const p=t.replace(/-/g,'+').replace(/_/g,'/'); return Uint8Array.from(atob(p+'='.repeat((4-p.length%4)%4)), c=>c.charCodeAt(0)); };
async function webPushState(){
  if(!webPushSupported()) return isIos() ? 'ios-install' : 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  try{ const sub = await (await swReady()).pushManager.getSubscription();
    if(sub && Notification.permission==='granted'){ if(!webPushState._sent){ webPushState._sent = true; api('POST','/api/push/web-subscribe',sub.toJSON()).catch(()=>{}); } return 'on'; }
    return 'off'; }catch(e){ return 'unsupported'; }
}
async function webPushOn(){
  if(await Notification.requestPermission() !== 'granted') return false;
  const reg = await swReady(); await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(STATE.webPushKey)});
  await api('POST','/api/push/web-subscribe',sub.toJSON()); webPushState._sent = true; return true;
}
async function webPushOff(){
  try{ if(isNative() || !('serviceWorker' in navigator)) return; const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await api('POST','/api/push/web-unsubscribe',{endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe().catch(()=>{}); } webPushState._sent = false; }catch(e){}
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.lcGo) location.hash = e.data.lcGo; });
async function webPushCard(box){
  const st = await webPushState(), onAccount = location.hash.startsWith('#/h/account');
  if(!document.body.contains(box)) return;
  const wrap = (cls, html) => `<div class="note ${cls}" style="margin-bottom:14px">${I.info}<div>${html}</div></div>`;
  if(st==='off') box.innerHTML = wrap('', `<b>Soyez prévenu en quelques secondes.</b><br>Recevez une alerte sur cet appareil à chaque nouvelle demande.<button class="btn sm mt" data-act="webpushon">Activer les alertes</button>`);
  else if(st==='ios-install') box.innerHTML = wrap('', `<b>Recevez les demandes sur votre iPhone.</b><br>Dans Safari, touchez <b>Partager</b>, puis <b>Sur l'écran d'accueil</b>. Ouvrez ensuite LateCheck depuis son icône pour activer les alertes.`);
  else if(st==='denied') box.innerHTML = wrap('warn', `Les notifications sont bloquées pour ce site. Autorisez-les dans les réglages de votre navigateur pour être prévenu des nouvelles demandes.`);
  else if(st==='on' && onAccount) box.innerHTML = wrap('', `<b>Alertes activées sur cet appareil.</b><br>Vous êtes prévenu à chaque nouvelle demande.<button class="btn soft sm mt" data-act="webpushtest">Envoyer une alerte de test</button>`);
  else box.innerHTML = '';
}
ACT.webpushon = btn => withLock(btn, async () => { const ok = await webPushOn(); toast(ok ? 'Alertes activées sur cet appareil' : 'Notifications non autorisées'); pushCard(); });
ACT.webpushtest = btn => withLock(btn, async () => { const r = await api('POST','/api/push/web-test'); toast(r.ok ? 'Alerte envoyée : elle arrive dans quelques secondes.' : 'L\'alerte n\'a pas pu être envoyée. Réactivez les alertes sur cet appareil.'); });
async function pushCard(){
  const box = $('#pushcard'); if(!box) return;
  if(!isNative()) return webPushCard(box);
  const st = await initPush(false);
  if(!document.body.contains(box)) return;
  if(st === 'prompt' || st === 'prompt-with-rationale') box.innerHTML = `<div class="note" style="margin-bottom:14px">${I.info}<div><b>Soyez prévenu en quelques secondes.</b><br>Recevez une notification à chaque nouvelle demande.<button class="btn sm mt" data-act="pushon">Activer les notifications</button></div></div>`;
  else if(st === 'denied') box.innerHTML = `<div class="note warn" style="margin-bottom:14px">${I.info}<div>Notifications désactivées. Pour les activer : Réglages de l'iPhone → LateCheck → Notifications.</div></div>`;
  else box.innerHTML = '';
}
ACT.pushon = btn => withLock(btn, async () => { const st = await initPush(true); toast(st==='granted' ? 'Notifications activées' : 'Notifications non autorisées'); pushCard(); });

/* Diagnostic des notifications : teste chaque maillon et dit lequel bloque */
ACT.pushtest = btn => withLock(btn, async () => {
  const box = $('#pushdiag'); if(!box) return;
  const P = PushPlugin(); const steps = [];
  const draw = (fin) => { box.innerHTML = `<div class="card" style="padding:14px 16px">${steps.map(([ok,t])=>`<div style="display:flex;gap:10px;margin:6px 0;line-height:1.4"><span>${ok===null?'⏳':ok?'✅':'❌'}</span><span>${t}</span></div>`).join('')}${fin?`<div class="hint" style="margin-top:10px">${fin}</div>`:''}</div>`; };
  const stop = (t, fin) => { steps.push([false, t]); draw(fin); };
  if(!P) return stop("Le module de notifications n'est pas installé dans l'app.", 'Dans le Terminal : <b>npx cap sync ios</b>, puis relancez avec ▶ dans Xcode.');
  // 1. Autorisation iOS
  let st = (await P.checkPermissions()).receive;
  if(st !== 'granted') st = (await P.requestPermissions()).receive;
  if(st !== 'granted') return stop('iOS bloque les notifications pour LateCheck.', 'Réglages de l’iPhone → LateCheck → Notifications → Autoriser les notifications.');
  steps.push([true,'Autorisation iOS accordée']); steps.push([null,'Demande du jeton à Apple…']); draw();
  // 2. Jeton fourni par iOS (passe par les 2 fonctions d'AppDelegate)
  const hs = [];
  const reg = await new Promise(async res => {
    const t = setTimeout(() => res({ err: 'timeout' }), 12000);
    hs.push(await P.addListener('registration', x => { clearTimeout(t); res({ token: x.value }); }));
    hs.push(await P.addListener('registrationError', e => { clearTimeout(t); res({ err: (e && (e.error || e.message)) || JSON.stringify(e) }); }));
    try{ await P.register(); }catch(e){ clearTimeout(t); res({ err: e.message || String(e) }); }
  });
  hs.forEach(h => { try{ h.remove(); }catch(e){} }); steps.pop();
  if(reg.err === 'timeout') return stop("iOS n'a pas transmis le jeton à l'app.", 'Vérifiez dans Xcode que <b>AppDelegate</b> contient les 2 fonctions (une seule fois chacune), puis relancez avec ▶.');
  if(reg.err) return stop('Apple a refusé l’enregistrement : ' + esc(reg.err), /aps-environment|entitlement/i.test(reg.err) ? 'Dans Xcode → App → Signing & Capabilities : ajoutez <b>Push Notifications</b>, puis relancez avec ▶.' : 'Vérifiez la connexion Internet de l’iPhone, puis réessayez.');
  steps.push([true, 'Jeton reçu d’Apple']);
  // 3. Enregistrement sur le serveur
  try{ await api('POST','/api/push/register',{token:reg.token}); steps.push([true,'iPhone enregistré sur le serveur']); }
  catch(e){ return stop('Le serveur n’a pas enregistré l’iPhone : ' + esc(e.message), 'Vérifiez que le dernier <b>server.js</b> est en ligne sur Render.'); }
  steps.push([null,'Envoi d’une notification de test…']); draw();
  // 4. Envoi réel via Apple
  let r; try{ r = await api('POST','/api/push/test'); }catch(e){ steps.pop(); return stop('Le serveur ne connaît pas le test : ' + esc(e.message), 'Mettez en ligne le dernier <b>server.js</b> sur GitHub, puis attendez « Live » sur Render.'); }
  steps.pop();
  if(!r.enabled){ const miss = [!r.keyFound&&(r.keyError?'APNS_KEY_BASE64 (clé illisible : '+esc(r.keyError)+')':'APNS_KEY_BASE64 : collez le contenu du fichier .p8 (pas son identifiant)'), r.keyIdLen!==10&&`APNS_KEY_ID (${r.keyIdLen} caractères au lieu de 10)`, r.teamIdLen!==10&&`APNS_TEAM_ID (${r.teamIdLen} caractères au lieu de 10)`].filter(Boolean);
    return stop('Notifications désactivées sur le serveur.', 'Sur Render → Environment, corrigez : ' + (miss.join(', ') || 'les variables APNS') + '. Puis Save, rebuild and deploy.'); }
  const all = r.results.flatMap(x => [x.prod, x.sand].filter(Boolean));
  if(all.some(x => x.status === 200)) { steps.push([true, `Notification acceptée par Apple (clé ${esc(r.keyId||'')})`]); return draw('Elle doit s’afficher dans les 5 secondes, même app ouverte. Si celle-ci arrive mais pas les vraies demandes : le paiement de test n’a pas atteint le serveur (webhook Stripe).'); }
  const reasons = all.map(x => x.reason).join(' ');
  const fix = /InvalidProviderToken/.test(reasons) ? 'Apple refuse la clé : sur Render, <b>APNS_KEY_ID</b> doit être l’ID de la clé .p8 et <b>APNS_TEAM_ID</b> l’ID d’équipe (developer.apple.com → Membership). La clé doit avoir le service « Apple Push Notifications ».'
    : /DeviceTokenNotForTopic|TopicDisallowed/.test(reasons) ? `Sur Render, <b>APNS_BUNDLE_ID</b> doit valoir <b>fr.latecheck.app</b> (actuellement : ${esc(r.bundleId)}).`
    : /illisible/.test(reasons) ? 'La clé .p8 est mal copiée dans <b>APNS_KEY_BASE64</b> : recopiez-la entièrement.'
    : /ExpiredProviderToken|TooManyProviderTokenUpdates/.test(reasons) ? 'Apple limite temporairement : réessayez dans 30 minutes.'
    : all.some(x => x.status === 0) ? 'Le serveur n’arrive pas à joindre Apple. Réessayez dans quelques minutes.'
    : 'Envoyez-moi une photo de cet écran.';
  stop('Apple a refusé l’envoi : ' + esc(all.map(x => `${x.status} ${x.reason}`).join(' / ')), fix);
});

/* ============================ Animation d'ouverture (app iOS) ============================ */
function playIntro(){
  if(!isNative() || window.__introDone) return; window.__introDone = true;
  const el = document.createElement('div'); el.id = 'intro'; el.setAttribute('aria-hidden','true');
  el.innerHTML = `<div class="stage">
    <svg viewBox="200 200 854 854" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lcg" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="1020"><stop offset="0" stop-color="#265B42"/><stop offset="1" stop-color="#1D4734"/></linearGradient></defs>
      <g class="logo" style="transform-origin:627px 627px">
        <g fill="none" stroke="url(#lcg)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round">
          <path class="arc" pathLength="1" d="M 690 972 A 360 360 0 1 1 966 503"/>
          <g transform="translate(625 685)"><g class="hands">
            <line x1="-153" y1="-82" x2="0" y2="0"/>
            <g class="mn"><line x1="0" y1="-265" x2="0" y2="0"/></g>
          </g></g>
          <path class="chk" pathLength="1" d="M 668 792 L 745 876 L 985 637"/>
        </g>
      </g>
    </svg>
  </div>`;
  document.body.appendChild(el);
  // L'écran de démarrage a la même couleur de fond : on le masque sans fondu dès que l'animation est affichée
  requestAnimationFrame(() => requestAnimationFrame(() => { try{ const S = window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen; if(S) S.hide({fadeOutDuration:0}); }catch(e){} }));
  let ended = false;
  const exit = () => { if(ended) return; ended = true; el.classList.add('out'); setTimeout(() => el.remove(), 520); };
  setTimeout(exit, matchMedia('(prefers-reduced-motion: reduce)').matches ? 350 : 1580);
  el.addEventListener('pointerdown', exit);
}
playIntro();

render();
if(isNative()) setTimeout(()=>{ if(STATE.me && STATE.me.role==='host') initPush(false); }, 1500);
</script>
